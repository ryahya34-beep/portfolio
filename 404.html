<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman tidak ditemukan — Ridwan Yahya</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#0f0f0d;color:#e9e7e0;
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;text-align:center}
  .mono{
    font-family:'IBM Plex Mono',monospace;
    font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;
    color:#8f8d84;margin-bottom:1.4rem;
  }
  h1{
    font-family:'Instrument Serif',serif;font-weight:400;
    font-size:clamp(2.4rem,8vw,4rem);line-height:1.1;letter-spacing:-.01em;
    margin-bottom:1.2rem;
  }
  h1 em{font-style:italic;color:#e0b356}
  p{color:#8f8d84;margin-bottom:2.2rem;max-width:42ch;margin-left:auto;margin-right:auto}
  a{
    display:inline-flex;align-items:center;gap:.5rem;
    text-decoration:none;font-weight:500;font-size:.92rem;
    padding:.75rem 1.5rem;border-radius:99px;
    background:#e0b356;color:#141310;
    transition:background .2s,transform .12s;
  }
  a:hover{background:#edca76}
  a:active{transform:scale(.97)}
</style>
</head>
<body>
  <div class="wrap">
    <p class="mono">Error 404</p>
    <h1>Halaman ini <em>tidak ada</em>.</h1>
    <p>URL yang kamu buka tak ditemukan — mungkin salah ketik, atau tautannya sudah pindah. Mari balik ke beranda dan mulai ulang.</p>
    <a href="/">← Kembali ke beranda</a>
  </div>
</body>
</html>
